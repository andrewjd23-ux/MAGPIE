name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/model-test-requirements.txt
      - name: Verify bundled detector and real inference
        run: |
          python -m pip install -r tools/model-test-requirements.txt
          python tools/verify_model.py
          python tools/verify_material_model.py
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Enable KVM for Android native tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android native material inference and acquisition regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Verify offline APK
        run: |
          python - <<'PYTHON'
          import os, subprocess
          permissions = subprocess.check_output([
              os.environ["ANDROID_HOME"] + "/build-tools/35.0.0/aapt", "dump", "permissions",
              "app/build/outputs/apk/debug/app-debug.apk"
          ], text=True)
          print(permissions)
          assert "android.permission.INTERNET" not in permissions
          PYTHON
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MAGPIE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest
      - name: Upload Android native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-reports
          path: app/build/reports/androidTests/connected
